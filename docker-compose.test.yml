# Isolated stack for E2E: web on an ephemeral host port, backends not published.
services:
  backend-java:
    build: ./backend
    environment:
      SERVER_PORT: 8090
    networks:
      default:
        aliases: [backend] # old service name, kept for compatibility

  backend-go:
    build: ./backend-go
    environment:
      PORT: 8091
    healthcheck:
      test: ["CMD", "/server", "-healthcheck"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

  web:
    build: ./frontend
    ports:
      - "80"
    depends_on:
      backend-java:
        condition: service_started
      backend-go:
        condition: service_started
