server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. With variables in proxy_pass the backends are
    # resolved per request (cached 10s), not at startup: nginx starts and keeps
    # serving when a backend is missing or stopped, and only that backend's
    # routes answer 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $java http://backend-java:8090;
    set $go http://backend-go:8091;

    # A just-stopped backend keeps its cached IP for up to 10s; without a short
    # connect timeout each request would hang 60s (nginx default) before the
    # 502/504 that triggers the frontend failover. A real calculation takes ms.
    proxy_connect_timeout 2s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location = /api/java/health {
        rewrite ^ /actuator/health break;
        proxy_pass $java;
    }

    location = /api/go/health {
        rewrite ^ /actuator/health break;
        proxy_pass $go;
    }

    # /api/java/v1/... -> backend-java /api/v1/...
    location /api/java/ {
        rewrite ^/api/java/(.*)$ /api/$1 break;
        proxy_pass $java;
    }

    # /api/go/v1/... -> backend-go /api/v1/...
    location /api/go/ {
        rewrite ^/api/go/(.*)$ /api/$1 break;
        proxy_pass $go;
    }

    # Compatibility: unprefixed /api/ goes to Java, URI unchanged
    location /api/ {
        proxy_pass $java;
    }

    location / {
        try_files $uri /index.html;
    }
}
