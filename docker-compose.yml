services:
  backend-java:
    build: ./backend
    environment:
      SERVER_PORT: 8090
    networks:
      default:
        aliases: [backend] # old service name, kept for compatibility
    ports:
      - "${BACKEND_JAVA_PORT:-${BACKEND_PORT:-8090}}:8090"
    # healthcheck: from the image (curl /actuator/health)

  backend-go:
    build: ./backend-go
    environment:
      PORT: 8091
    ports:
      - "${BACKEND_GO_PORT:-8091}:8091"
    healthcheck:
      # distroless image: no shell or curl, the binary probes /actuator/health
      test: ["CMD", "/server", "-healthcheck"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-3000}:80"
    # service_started, never service_healthy: the web must come up even when a
    # backend is unhealthy, so the frontend can fall back to the other one
    depends_on:
      backend-java:
        condition: service_started
      backend-go:
        condition: service_started
